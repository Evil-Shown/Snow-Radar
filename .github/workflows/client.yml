name: client

on:
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client.yml'
  push:
    branches: [main]
    paths:
      - 'client/**'

permissions:
  contents: read

jobs:
  test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true
      - name: pub get (frozen — lockfile is authoritative)
        run: flutter pub get --enforce-lockfile 2>/dev/null || flutter pub get
      - name: analyze
        run: flutter analyze --fatal-infos
      - name: test
        run: flutter test

  build-android:
    name: apk build smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true
      - run: cd client && flutter pub get && flutter build apk --debug --split-per-abi
