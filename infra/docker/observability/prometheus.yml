global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'snowradar-vpn'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter on VPN servers
  # SECURITY (audit #4/#14): exporters bind ONLY to WireGuard IPs (ADR-004).
  # Scraping requires the monitoring host to be inside the VPN mesh.
  - job_name: 'node-exporter-vpn'
    metrics_path: /metrics
    scheme: http
    static_configs:
      # Oracle Cloud Singapore (ARM) — wg0 server IP
      - targets: ['10.20.0.1:9100']
        labels:
          instance: 'sgp-arm'
          region: 'apac'
          provider: 'oracle'
          arch: 'arm64'
      # Hetzner Falkenstein (x86) — wg0 server IP
      - targets: ['10.21.0.1:9100']
        labels:
          instance: 'fsn-x86'
          region: 'eu'
          provider: 'hetzner'
          arch: 'amd64'

  # WireGuard interface metrics (via node exporter)
  - job_name: 'wireguard-interfaces'
    metrics_path: /metrics
    static_configs:
      - targets: ['10.20.0.1:9595', '10.21.0.1:9595']

# Remote write for long-term storage (optional, for future)
# remote_write:
#   - url: https://prometheus.example.com/api/v1/write